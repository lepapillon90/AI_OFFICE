name: ai_office
description: Flutter Windows desktop shell for AI Office.
publish_to: none

environment:
  sdk: ^3.0.0

dependencies:
  file_selector: ^1.1.0
  flame: ^1.20.0
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/tiles/
    - assets/images/tiles/floor/
    - assets/images/tiles/walls/
    - assets/images/characters/
    - assets/images/objects/
    - assets/images/office_2f/floors/
    - assets/images/office_1f/v3/floor/cafe/
    - assets/images/office_1f/v3/floor/elevator_front/
    - assets/images/office_1f/v3/floor/indoor_entrance/
    - assets/images/office_1f/v3/floor/lounge/
    - assets/images/office_1f/v3/floor/main_lobby/
    - assets/images/office_1f/v3/floor/outdoor_plaza/
    - assets/images/office_1f/v3/floor/planter_edge/
    - assets/images/office_1f/v3/floor/pond_walkway/
    - assets/images/office_1f/v3/floor/reception_lobby/
    - assets/images/office_1f/v3/floor/shallow_water/
    - assets/images/office_1f/v3/floor/stair_landing/
    - assets/images/office_1f/v3/floor/store/
    - assets/images/office_1f/v4/structure/
    - assets/images/office_1f/v4/lobby/
    - assets/images/office_1f/v4/cafe/
    - assets/images/office_1f/v4/store/
    - assets/images/office_1f/v4/branding/
    - assets/images/office_1f/v4/entrance/
    - assets/images/office_2f/walls/
    - assets/images/office_2f/glass/
    - assets/images/office_2f/partitions/
    - assets/images/office_2f/desks/
    - assets/images/office_2f/chairs/
    - assets/images/office_2f/computers/
    - assets/images/office_2f/plants/
    - assets/images/office_2f/lights/
    - assets/images/office_2f/hr/
    - assets/images/office_2f/development/
    - assets/images/office_2f/marketing/
    - assets/images/office_2f/server_room/
    - assets/images/office_2f/lounge/
    - assets/images/office_2f/signs/
    - assets/images/office_2f/branding/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
